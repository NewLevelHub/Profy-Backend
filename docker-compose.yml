services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profi_db
      POSTGRES_USER: profi_user
      POSTGRES_PASSWORD: profi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profi_user -d profi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://profi_user:profi_password@db:5432/profi_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      # University photos live on the host, not in the image. Mounted
      # read-write here so the scripts/import_*_photos.py jobs can write new
      # files; nginx mounts the same folder read-only to serve them.
      # STORAGE_FS_ROOT (.env) points at /srv/media. Override the host path
      # with MEDIA_DIR (e.g. MEDIA_DIR=/srv/profy-media on a server).
      - ${MEDIA_DIR:-../profy-media}:/srv/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/nginx.conf:ro
      - ${MEDIA_DIR:-../profy-media}:/srv/media:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
