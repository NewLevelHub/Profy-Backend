services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profi_db
      POSTGRES_USER: profi_user
      POSTGRES_PASSWORD: profi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profi_user -d profi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://profi_user:profi_password@db:5432/profi_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Output-only mounts so generated review files survive `docker-compose
      # run --rm` and land on the host. Not code bind-mounts — app code still
      # ships baked into the image.
      - ./scripts/taxonomy_proposals:/app/scripts/taxonomy_proposals
      - ./scripts/question_proposals:/app/scripts/question_proposals
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
