services:
  db:
    image: postgres:16-alpine
    container_name: profi_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # Pass credentials via env_file (literal) — do NOT re-interpolate
    # POSTGRES_PASSWORD with ${...}: special chars like @ ! break it.
    env_file:
      - .env.development
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - profi_network_dev

  redis:
    image: redis:7-alpine
    container_name: profi_redis_dev
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profi_network_dev

  api:
    image: ${API_IMAGE}
    container_name: profi_api_dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.development
    environment:
      # Only override host wiring — DB user/password come from env_file as-is
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: always
    networks:
      - profi_network_dev
      - profi_edge

volumes:
  postgres_data_dev:
    driver: local

networks:
  profi_network_dev:
    name: profi_network_dev
    driver: bridge
  profi_edge:
    external: true
    name: ${PROFI_EDGE_NETWORK_NAME:-profi-backend_profi_network}
