name: Profi Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build_and_push:
    name: Build and push production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_latest }}
            ${{ steps.image_meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_production:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose and nginx config to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,COMMIT_SHA
          script: |
            set -e

            # GitHub secrets sometimes include a trailing newline when pasted.
            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            SHORT_SHA="${COMMIT_SHA::7}"
            export API_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:sha-${SHORT_SHA}"

            if [ ! -f ".env.production" ]; then
              echo "ERROR: .env.production not found in $DEPLOY_PATH"
              exit 1
            fi
            if ! grep -Eq '^POSTGRES_DB=.+' .env.production || \
               ! grep -Eq '^POSTGRES_USER=.+' .env.production || \
               ! grep -Eq '^POSTGRES_PASSWORD=.+' .env.production || \
               ! grep -Eq '^SECRET_KEY=.+' .env.production; then
              echo "ERROR: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD and SECRET_KEY must be set in .env.production"
              exit 1
            fi

            grep -v '^API_IMAGE=' .env.production > .env.production.tmp
            echo "API_IMAGE=${API_IMAGE}" >> .env.production.tmp
            mv .env.production.tmp .env.production

            docker pull "$API_IMAGE"

            docker rm -f profi_api_prod profi_nginx_prod 2>/dev/null || true

            # Ensure db/redis are running (first deploy); do not force-recreate to keep data volumes.
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d db redis

            echo "Waiting for PostgreSQL to become healthy..."
            for i in $(seq 1 60); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T db pg_isready -U "$(grep '^POSTGRES_USER=' .env.production | cut -d= -f2-)" -d "$(grep '^POSTGRES_DB=' .env.production | cut -d= -f2-)" >/dev/null 2>&1; then
                echo "PostgreSQL is ready after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: PostgreSQL did not become ready within 60s"
                docker compose --env-file .env.production -f docker-compose.prod.yml logs db | tail -40
                exit 1
              fi
              sleep 1
            done

            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate --remove-orphans api nginx

            echo "Waiting for API container to finish migrations + uvicorn startup..."
            for i in $(seq 1 60); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', 8000)); s.close()" >/dev/null 2>&1; then
                echo "API is ready after ${i}s"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: API did not become ready within 60s"
                docker compose --env-file .env.production -f docker-compose.prod.yml logs api | tail -40
                exit 1
              fi
              sleep 1
            done

            echo "Running seed scripts..."
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api python scripts/seed_questions.py
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api python scripts/seed_universities.py
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api python scripts/seed_directions.py

            echo "=== Production deploy complete ==="
            echo "Image: $API_IMAGE"
            docker compose --env-file .env.production -f docker-compose.prod.yml ps
