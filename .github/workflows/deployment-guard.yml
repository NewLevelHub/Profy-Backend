name: deployment isolation

on:
  pull_request:
    branches: [dev, main]
  merge_group:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests/deployment -v
