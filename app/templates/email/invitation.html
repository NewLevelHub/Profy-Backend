<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Приглашение в Profile</title>
</head>
<body style="margin:0;padding:0;background-color:#F8F9F5;font-family:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F9F5;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">

          <!-- Wordmark -->
          <tr>
            <td style="padding:0 4px 24px;">
              <p style="margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:-0.06em;color:#164D3E;">profile<span style="color:#95633F;">.</span></p>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#FFFFFF;border:1px solid #E1E7DC;border-radius:20px;padding:40px 36px;">

              <p style="margin:0 0 18px;">
                <span style="display:inline-block;padding:6px 12px;border-radius:999px;background-color:#EAF1E8;color:#164D3E;font-size:12px;font-weight:500;line-height:1.4;">Приглашение в команду</span>
              </p>

              <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-0.03em;color:#203A30;">
                Вас ждут в Profile
              </h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.65;color:#56645C;">
                Администратор пригласил вас {role}. Придумайте пароль — и сразу попадёте в свой кабинет.
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" bgcolor="#164D3E" style="border-radius:12px;">
                    <a href="{invite_url}" style="display:inline-block;padding:15px 30px;border-radius:12px;background-color:#164D3E;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;line-height:1.2;">
                      Принять приглашение&nbsp;&rarr;
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #E1E7DC;font-size:13px;line-height:1.6;color:#65735F;">
                Приглашение действует {hours}&nbsp;ч. Если вы его не ждали, просто проигнорируйте письмо.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 4px 0;">
              <p style="margin:0;font-size:12px;color:#65735F;">© 2026 Profile</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
