<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Сброс пароля — Profy</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F3FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3FF;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#7C3AED;border-radius:18px;width:64px;height:64px;text-align:center;vertical-align:middle;">
                    <span style="font-size:32px;font-weight:900;color:#FFFFFF;line-height:64px;display:block;">P</span>
                  </td>
                </tr>
              </table>
              <p style="margin:12px 0 0;font-size:22px;font-weight:800;color:#1E1B4B;letter-spacing:-0.3px;">Profy</p>
              <p style="margin:4px 0 0;font-size:13px;color:#9CA3AF;">Найди дело, которое тебе по душе</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#FFFFFF;border-radius:20px;padding:40px 40px 36px;box-shadow:0 4px 24px rgba(124,58,237,0.10);">

              <!-- Lock icon -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
                <tr>
                  <td style="background-color:#FFF7ED;border-radius:12px;width:48px;height:48px;text-align:center;vertical-align:middle;">
                    <span style="font-size:24px;line-height:48px;display:block;">🔐</span>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 8px;font-size:24px;font-weight:800;color:#1E1B4B;letter-spacing:-0.4px;">
                Сброс пароля
              </h1>
              <p style="margin:0 0 28px;font-size:15px;color:#4B5563;line-height:1.6;">
                Ты запросил сброс пароля. Введи этот код в приложении — он действителен&nbsp;<strong>15&nbsp;минут</strong>.
              </p>

              <!-- Code block -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:28px 0;background-color:#F5F3FF;border-radius:14px;border:2px solid #EDE9FE;">
                    <span style="font-size:42px;font-weight:900;color:#7C3AED;letter-spacing:16px;font-variant-numeric:tabular-nums;">
                      {code}
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Warning banner -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                <tr>
                  <td style="background-color:#FFF7ED;border-radius:10px;padding:14px 18px;border-left:3px solid #EA580C;">
                    <p style="margin:0;font-size:13px;color:#92400E;line-height:1.5;">
                      <strong>Не запрашивал сброс?</strong><br/>
                      Просто проигнорируй это письмо — твой пароль останется прежним.
                    </p>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#9CA3AF;">
                © 2025 Profy. Все права защищены.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
