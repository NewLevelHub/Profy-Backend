<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Подтверждение почты — Profy</title>
</head>
<body style="margin:0;padding:0;background-color:#EDE9DF;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EDE9DF;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <p style="margin:0;font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:600;color:#131C1B;letter-spacing:-0.01em;">
                Profy
              </p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#F7F5EF;border:1px solid #BDB6A6;border-radius:8px;padding:40px 36px 36px;">

              <h1 style="margin:0 0 8px;font-family:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700;color:#131C1B;letter-spacing:-0.015em;">
                Подтверди почту
              </h1>
              <p style="margin:0 0 28px;font-size:15px;color:#6B7671;line-height:1.5;">
                Введи этот код в приложении, чтобы завершить регистрацию. Код действителен&nbsp;<strong style="color:#26332F;">15&nbsp;минут</strong>.
              </p>

              <!-- Code block -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding:26px 0;background-color:#E7EDEA;border-radius:8px;border:1px solid #BFD6CD;">
                    <span style="font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:36px;font-weight:600;color:#0E4A41;letter-spacing:12px;">
                      {code}
                    </span>
                  </td>
                </tr>
              </table>

              <p style="margin:24px 0 0;font-size:13px;color:#9A9287;line-height:1.5;text-align:center;">
                Если ты не регистрировался в Profy — просто проигнорируй это письмо.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:12px;color:#9A9287;">
                © 2026 Profy. Все права защищены.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
