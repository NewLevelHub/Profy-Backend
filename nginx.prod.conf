events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No nginx version in the Server header or on error pages.
    server_tokens off;

    # Compress text on the way out — the SPA bundle (~1.8 MB of JS raw) and the
    # API's JSON. Images and fonts are already compressed and are left alone.
    # Applies to proxied responses too: the frontend container sends them raw.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Docker embedded DNS — needed for runtime resolve of optional *_dev containers
    # and of the prod frontend container, which may not exist yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # University photos are served off disk from /srv/media (the host media
    # folder is bind-mounted read-only into this container — see
    # docker-compose.prod.yml). The same folder backs both vhosts below;
    # dev.profile.newlevelhub.kz has no nginx of its own.

    # -- Prod: profile.newlevelhub.kz --
    # Renamed from profy.newlevelhub.kz 2026-10-01 — app renamed profy -> profile.
    server {
        listen 80;
        server_name profile.newlevelhub.kz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name profile.newlevelhub.kz;
        # The API takes JSON only (no file uploads); the largest legitimate body is
        # the АСТУР bank document, about 110 KB. Field-level limits live in the
        # request schemas — this is the ceiling for what reaches them at all.
        client_max_body_size 2M;

        ssl_certificate     /etc/letsencrypt/live/profile.newlevelhub.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/profile.newlevelhub.kz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Sent on every response of this vhost, error pages included
        # (`always`). nginx drops inherited add_header lines in any location
        # that sets its own — /media/ below repeats them for that reason.
        # HSTS is per host on purpose (no includeSubDomains): it must not
        # start applying to a subdomain nobody checked for HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /media/ {
            alias /srv/media/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        location /api/ {
            set $api_prod_upstream http://profi_api_prod:8000;
            proxy_pass $api_prod_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # No /docs and no /openapi.json here: the schema lists every route,
        # admin ones included. The API has them switched off as well
        # (API_DOCS_ENABLED in docker-compose.prod.yml). Dev keeps both.

        # Lazy-resolved (not a static `upstream` block): a missing/restarting
        # profy_frontend_prod container 502s only this location instead of
        # crash-looping the whole shared edge nginx for both domains.
        location / {
            set $frontend_prod_upstream http://profy_frontend_prod:80;
            proxy_pass $frontend_prod_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -- Dev: dev.profile.newlevelhub.kz (same edge nginx, runtime DNS) --
    # Renamed from dev.profy.newlevelhub.kz 2026-09-30 — app renamed profy -> profile.
    server {
        listen 80;
        server_name dev.profile.newlevelhub.kz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dev.profile.newlevelhub.kz;
        # The API takes JSON only (no file uploads); the largest legitimate body is
        # the АСТУР bank document, about 110 KB. Field-level limits live in the
        # request schemas — this is the ceiling for what reaches them at all.
        client_max_body_size 2M;

        ssl_certificate     /etc/letsencrypt/live/dev.profile.newlevelhub.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.profile.newlevelhub.kz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Sent on every response of this vhost, error pages included
        # (`always`). nginx drops inherited add_header lines in any location
        # that sets its own — /media/ below repeats them for that reason.
        # HSTS is per host on purpose (no includeSubDomains): it must not
        # start applying to a subdomain nobody checked for HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Dev has no nginx of its own — same on-disk media folder as prod.
        location /media/ {
            alias /srv/media/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        location /api/ {
            set $api_dev_upstream http://profi_api_dev:8000;
            proxy_pass $api_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            set $api_dev_upstream http://profi_api_dev:8000;
            proxy_pass $api_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            set $api_dev_upstream http://profi_api_dev:8000;
            proxy_pass $api_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_dev_upstream http://profy_frontend_dev:80;
            proxy_pass $frontend_dev_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
