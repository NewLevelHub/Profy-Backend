services:
  db:
    image: postgres:16-alpine
    container_name: profi_db_prod
    # A deploy step whose client dies mid-transaction (cancelled CD workflow,
    # `docker rm -f` on the api container while a script like
    # build_universities.py is still running) leaves that transaction's row
    # locks held until Postgres notices the dropped connection — with no
    # timeout set, that relies on OS-level TCP keepalive, which can take
    # hours and has required a full server reboot to clear in practice
    # (see docs — the cd-dev.yml hang on 2026-09-03). This kills any session
    # that is inside an open transaction but idle (not executing a query,
    # i.e. waiting on a client that's gone) for 5 minutes. Does not affect
    # genuinely long-running active queries/transactions.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=300000"]
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - profi_network

  redis:
    image: redis:7-alpine
    container_name: profi_redis_prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profi_network

  api:
    image: ${API_IMAGE}
    container_name: profi_api_prod
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    volumes:
      # University photos live on the host, served by nginx (STORAGE_BACKEND=fs
      # in .env.production, STORAGE_FS_ROOT=/srv/media). Read-write so the
      # scripts/import_*_photos.py jobs can add files; nginx mounts the same
      # folder read-only. MEDIA_DIR is the host path (see docs) — the same
      # folder also backs dev.profy.newlevelhub.kz, which has no nginx of its own.
      - ${MEDIA_DIR:-/srv/profy-media}:/srv/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: always
    networks:
      - profi_network

  nginx:
    image: nginx:alpine
    container_name: profi_nginx_prod
    volumes:
      # nginx.conf is regenerated from git-tracked nginx.prod.conf by the CD
      # pipeline (`cp nginx.prod.conf nginx.conf` under a flock) — do not point
      # this at nginx.prod.conf directly, cd.yml/cd-dev.yml both rely on the
      # generated file.
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MEDIA_DIR:-/srv/profy-media}:/srv/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: always
    networks:
      - profi_network

volumes:
  postgres_data_prod:
    driver: local

networks:
  profi_network:
    driver: bridge
